[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generation and pathfinding package that can be used with different input parsers and visualization tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "msowinsk", email = "msowinsk@student.42warsaw.pl"},
    {name = "asuleime", email = "asuleime@student.42warsaw.pl"}
]
requires-python = ">=3.13"
dependencies = [
    "disjoint-set>=0.9.0"
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "pytest-stub>=1.1.0",
]
